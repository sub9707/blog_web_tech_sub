<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500" role="img" aria-labelledby="t d">
  <title id="t">2026 서울주거포럼 프로젝트 아키텍처</title>
  <desc id="d">시민과 운영자가 Cloudflare Workers 위의 Next.js 애플리케이션에 접근하고, 애플리케이션은 Cloudflare D1, Supabase Storage, GA4 Data API와 연결된다. 시민이 등록한 의견은 검수 대기 상태로 저장되고 운영자 승인 후에만 공개된다.</desc>

  <style>
    .hd { font: 700 15px sans-serif; fill: #fff; }
    .gt { font: 600 14px sans-serif; fill: #1D6FD8; }
    .nm { font: 700 15px sans-serif; fill: #1F2937; }
    .sb { font: 400 11.5px sans-serif; fill: #6B7280; }
    .el { font: 600 11px sans-serif; fill: #475569; }
    .eo { font: 700 11px sans-serif; fill: #D2690A; }
    .fn { font: 400 11.5px sans-serif; fill: #94A3B8; }
    .card { fill: #fff; stroke: #D8DEE8; stroke-width: 1; }
    .line { stroke: #94A3B8; stroke-width: 1.6; fill: none; }
    .flow { stroke: #E8710A; stroke-width: 2.4; fill: none; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8710A"/>
    </marker>
  </defs>

  <rect width="1080" height="500" fill="#FBFCFE"/>

  <!-- 그룹 컨테이너 -->
  <rect x="32"  y="72" width="176" height="400" rx="10" fill="#6B7280" fill-opacity="0.05" stroke="#6B7280" stroke-opacity="0.22"/>
  <rect x="240" y="72" width="456" height="400" rx="10" fill="#1D6FD8" fill-opacity="0.05" stroke="#1D6FD8" stroke-opacity="0.22"/>
  <rect x="728" y="72" width="320" height="400" rx="10" fill="#2E9E5B" fill-opacity="0.05" stroke="#2E9E5B" stroke-opacity="0.22"/>

  <!-- 그룹 헤더 -->
  <rect x="32"  y="24" width="176" height="34" rx="6" fill="#6B7280"/>
  <text class="hd" x="120" y="46" text-anchor="middle">사용자</text>
  <rect x="240" y="24" width="456" height="34" rx="6" fill="#1D6FD8"/>
  <text class="hd" x="468" y="46" text-anchor="middle">애플리케이션</text>
  <rect x="728" y="24" width="320" height="34" rx="6" fill="#2E9E5B"/>
  <text class="hd" x="888" y="46" text-anchor="middle">데이터 · 외부 연동</text>

  <text class="gt" x="468" y="99" text-anchor="middle">Next.js 16 (App Router)</text>

  <!-- 사용자 -->
  <rect class="card" x="52" y="112" width="136" height="72" rx="8"/>
  <text class="nm" x="120" y="143" text-anchor="middle">시민 방문자</text>
  <text class="sb" x="120" y="163" text-anchor="middle">로그인 없음</text>

  <rect class="card" x="52" y="348" width="136" height="72" rx="8"/>
  <text class="nm" x="120" y="379" text-anchor="middle">운영자</text>
  <text class="sb" x="120" y="399" text-anchor="middle">관리자 로그인</text>

  <!-- 애플리케이션 -->
  <rect class="card" x="268" y="110" width="400" height="76" rx="8"/>
  <text class="nm" x="288" y="138">(site) 공개 페이지</text>
  <text class="sb" x="288" y="158">포럼 소개 · 프로그램 · 오시는 길 · 소통의 장</text>
  <text class="eo" x="288" y="176">승인된 의견만 노출</text>

  <rect class="card" x="268" y="228" width="400" height="76" rx="8"/>
  <text class="nm" x="288" y="256">Route Handlers</text>
  <text class="sb" x="288" y="276">/api/notices · /api/board · /api/admin/*</text>
  <text class="sb" x="288" y="294">Turnstile 검증 · 레이트리밋 · 입력 검증</text>

  <rect class="card" x="268" y="346" width="400" height="76" rx="8"/>
  <text class="nm" x="288" y="374">admin/(panel) 관리자</text>
  <text class="sb" x="288" y="394">공지 관리 · 의견 검수 · 방문 통계</text>
  <text class="sb" x="288" y="412">proxy.ts 1차 확인 → DAL 재검증</text>

  <text class="sb" x="468" y="455" text-anchor="middle">Cloudflare Workers · @opennextjs/cloudflare</text>

  <!-- 데이터 · 외부 연동 -->
  <rect class="card" x="748" y="146" width="280" height="80" rx="8"/>
  <text class="nm" x="768" y="176">Cloudflare D1</text>
  <text class="sb" x="768" y="196">공지 · 의견 · 관리자 세션</text>
  <text class="sb" x="768" y="214">업로드 메타데이터</text>

  <rect class="card" x="748" y="238" width="280" height="64" rx="8"/>
  <text class="nm" x="768" y="266">Supabase Storage</text>
  <text class="sb" x="768" y="286">첨부파일 · 에디터 이미지 본체</text>

  <rect class="card" x="748" y="314" width="280" height="64" rx="8"/>
  <text class="nm" x="768" y="342">GA4 Data API</text>
  <text class="sb" x="768" y="362">방문 통계 · Workers Cache 10분</text>

  <!-- 연결선 -->
  <path class="line" d="M188,148 H262" marker-end="url(#a)"/>
  <text class="el" x="225" y="141" text-anchor="middle">열람</text>

  <path class="line" d="M188,384 H262" marker-end="url(#a)"/>
  <text class="el" x="225" y="377" text-anchor="middle">로그인</text>

  <path class="flow" d="M360,186 V222" marker-end="url(#ao)"/>
  <text class="eo" x="374" y="209">의견 등록 → 검수 대기 저장</text>

  <path class="flow" d="M360,346 V310" marker-end="url(#ao)"/>
  <text class="eo" x="374" y="332">승인 / 반려</text>

  <path class="line" d="M668,254 L742,190" marker-end="url(#a)"/>
  <path class="line" d="M668,266 H742" marker-end="url(#a)"/>
  <path class="line" d="M668,278 L742,340" marker-end="url(#a)"/>

  <text class="fn" x="32" y="490">주황색 — 시민 의견이 공개되기까지의 검수 흐름</text>
</svg>
