events {
  worker_connections 1024;
}

http {
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

  server_tokens off;

  limit_req_zone $binary_remote_addr zone=blog_req:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=stats_req:1m rate=10r/m;
  limit_req_status 429;

  map $request_uri $is_probe_path {
    ~*\.(php|asp|aspx|jsp|cgi|env|sql|bak|ini|cfg)(\?|$) 1;
    ~*/\.(git|svn|hg|aws|ssh|docker|vscode)(/|$) 1;
    ~*^/(wp-|wordpress|wp/|xmlrpc|phpmyadmin|pma|myadmin|admin|administrator|webconsole|console|manager|cgi-bin|actuator|vendor|boaform|hnap1|solr|druid|owa|ecp|autodiscover|remote|geoserver|login\.action) 1;
    default 0;
  }

  map $http_user_agent $is_scanner_agent {
    "" 1;
    ~*(zgrab|masscan|nmap|nikto|sqlmap|nuclei|censys|expanse|l9explore|l9tcpid|leakix|odin|internetmeasurement|netcraft|scanner) 1;
    default 0;
  }

  map "$is_probe_path$is_scanner_agent" $is_blocked_request {
    "00" 0;
    default 1;
  }

  map $request_uri $blog_path_loggable {
    ~^/_next/ 0;
    ~opengraph-image 0;
    ~^/favicon 0;
    ~^/stats 0;
    default 1;
  }

  map $http_next_router_prefetch $blog_prefetch_loggable {
    "" $blog_path_loggable;
    default 0;
  }

  map $is_blocked_request $blog_loggable {
    1 0;
    default $blog_prefetch_loggable;
  }

  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
  }

  server {
    listen 80;
    server_name subdevpi.mywire.org;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name subdevpi.mywire.org;

    ssl_certificate /etc/letsencrypt/live/subdevpi.mywire.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subdevpi.mywire.org/privkey.pem;

    access_log /var/log/nginx/blog/access.log combined if=$blog_loggable;

    if ($is_blocked_request) {
      return 444;
    }

    location = /stats {
      limit_req zone=stats_req burst=5 nodelay;
      auth_basic "stats";
      auth_basic_user_file /etc/nginx/.htpasswd;
      alias /srv/goaccess/report.html;
      default_type text/html;
      add_header Cache-Control "no-store";
      add_header X-Robots-Tag "noindex, nofollow";
    }

    location / {
      limit_req zone=blog_req burst=40 nodelay;
      proxy_pass http://blog:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_cache_bypass $http_upgrade;
    }
  }


  # qr-pass (행사 QR 입장·설문) — 파이 호스트 4001에서 pm2 구동, 여기서 HTTPS 종단
  server {
    listen 9443 ssl;
    server_name subdevpi.mywire.org;

    ssl_certificate /etc/letsencrypt/live/subdevpi.mywire.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subdevpi.mywire.org/privkey.pem;

    location / {
      proxy_pass http://host.docker.internal:4001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_cache_bypass $http_upgrade;
    }
  }


  # biodance-demo (포트폴리오 임베드용 키오스크·QR 패스 데모) — 파이 호스트 9001에서 pm2 구동, 여기서 HTTPS 종단
  server {
    listen 9000 ssl;
    server_name subdevpi.mywire.org;

    ssl_certificate /etc/letsencrypt/live/subdevpi.mywire.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subdevpi.mywire.org/privkey.pem;

    error_page 497 =301 https://$host:$server_port$request_uri;

    location / {
      proxy_pass http://host.docker.internal:9001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
