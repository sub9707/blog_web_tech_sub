events {
  worker_connections 1024;
}

http {
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

  server {
    listen 80;
    server_name subdevpi.mywire.org;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name subdevpi.mywire.org;

    ssl_certificate /etc/letsencrypt/live/subdevpi.mywire.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subdevpi.mywire.org/privkey.pem;

    location / {
      proxy_pass http://blog:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_cache_bypass $http_upgrade;
    }
  }


  server {
    listen 8443 ssl;
    server_name subdevpi.mywire.org;

    ssl_certificate /etc/letsencrypt/live/subdevpi.mywire.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subdevpi.mywire.org/privkey.pem;

    location / {
      proxy_pass http://host.docker.internal:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }


  # qr-pass (행사 QR 입장·설문) — 파이 호스트 4001에서 pm2 구동, 여기서 HTTPS 종단
  server {
    listen 9443 ssl;
    server_name subdevpi.mywire.org;

    ssl_certificate /etc/letsencrypt/live/subdevpi.mywire.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subdevpi.mywire.org/privkey.pem;

    location / {
      proxy_pass http://host.docker.internal:4001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_cache_bypass $http_upgrade;
    }
  }


  # biodance-demo (포트폴리오 임베드용 키오스크·QR 패스 데모) — 파이 호스트 9001에서 pm2 구동, 여기서 HTTPS 종단
  server {
    listen 9000 ssl;
    server_name subdevpi.mywire.org;

    ssl_certificate /etc/letsencrypt/live/subdevpi.mywire.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/subdevpi.mywire.org/privkey.pem;

    error_page 497 =301 https://$host:$server_port$request_uri;

    location / {
      proxy_pass http://host.docker.internal:9001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
