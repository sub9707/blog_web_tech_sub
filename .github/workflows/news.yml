name: FE News

on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fe-news
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Lint news scripts
        run: npx eslint scripts/news

      - name: Collect and summarize news
        id: news
        run: npm run news
        env:
          NEWS_LLM_PROVIDER: ${{ vars.NEWS_LLM_PROVIDER }}
          NEWS_LLM_API_KEY: ${{ secrets.NEWS_LLM_API_KEY }}
          NEWS_LLM_BASE_URL: ${{ vars.NEWS_LLM_BASE_URL }}
          NEWS_LLM_MODELS: ${{ vars.NEWS_LLM_MODELS }}
          TZ: Asia/Seoul

      - name: Create review pull request
        if: steps.news.outputs.has_news == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: news/weekly-draft
          delete-branch: true
          add-paths: content/news
          commit-message: 'add: ${{ steps.news.outputs.title }}'
          title: 'add: ${{ steps.news.outputs.title }}'
          body-path: ${{ steps.news.outputs.body_path }}
          labels: fe-news
